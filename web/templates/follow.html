<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跟单管理 · 福纹排行榜</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="fwui-nav">
    <div class="fwui-nav__logo">🟣 福纹排行榜</div>
    <div class="fwui-nav__links">
      <a class="fwui-nav__link" href="/">📊 榜单</a>
      <a class="fwui-nav__link" href="/accounts">💼 我的账户</a>
      <a class="fwui-nav__link fwui-nav__link--active" href="/follow">👥 跟单</a>
      <a class="fwui-nav__link" href="/rental">🤖 租用智能体</a>
      <a class="fwui-nav__link" href="/admin">⚙️ 控制台</a>
    </div>
    <div class="fwui-nav__actions fwui-nav-actions-slot"></div>
    <button class="fwui-btn fwui-btn--sm" data-theme-toggle>明亮</button>
  </nav>

  <main class="fwui-main">
    <h1 class="fwui-page-title">👥 跟单管理</h1>
    <p class="fwui-page-subtitle">订阅高胜算交易员，自动跟单其信号 · 支持"订阅费 + 利润分成"双轨</p>

    <div class="fwui-tabs">
      <div class="fwui-tab fwui-tab--active" data-tab="market">🌟 跟单市场</div>
      <div class="fwui-tab" data-tab="my">📋 我的订阅</div>
    </div>

    <!-- 跟单市场 -->
    <div id="tab-market">
      <div id="market-grid" class="fwui-card-grid fwui-card-grid--wide"></div>
    </div>

    <!-- 我的订阅 -->
    <div id="tab-my" style="display:none;">
      <div id="my-grid" class="fwui-card-grid fwui-card-grid--wide"></div>
    </div>
  </main>

  <script src="/static/js/fwui/theme.js"></script>
  <script src="/static/js/fwui/toast.js"></script>
  <script src="/static/js/fwui/modal.js"></script>
  <script src="/static/js/fwui/api.js"></script>
  <script src="/static/js/fwui/utils.js"></script>
  <script src="/static/js/fwui/charts.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/follow.js"></script>
</body>
</html>
