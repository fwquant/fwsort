<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租用智能体 · 福纹排行榜</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="fwui-nav">
    <a href="/" class="fwui-nav__logo-link">
      <div class="fwui-nav__logo">🟣 福纹排行榜</div>
    </a>
    <div class="fwui-nav__links">
      <!-- 策略 -->
      <div class="fwui-nav__dropdown" data-nav-group="strategy">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link" href="/strategy/leaderboard">📡 策略</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/strategy/leaderboard">🏆 策略榜单</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/auto-tasks">🤖 自动策略</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/logs">📜 策略日志</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/tasks">📡 策略管理</a>
        </div>
      </div>
      <!-- 账户 -->
      <div class="fwui-nav__dropdown" data-nav-group="accounts">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link" href="/accounts" title="我的执行账户">💼 账户</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/accounts">💼 执行账户</a>
          <a class="fwui-nav__dropdown-item" href="/accounts/tasks">🛰 账户任务</a>
          <a class="fwui-nav__dropdown-item" href="/accounts/execution">⚡ 执行记录</a>
        </div>
      </div>
      <!-- 齿轮 -->
      <div class="fwui-nav__dropdown" data-nav-group="console">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link fwui-nav__link--active" href="/admin" title="控制台">⚙️</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/admin">⚙️ 控制台</a>
          <a class="fwui-nav__dropdown-item" href="/risk">🛡️ 风控中心</a>
          <a class="fwui-nav__dropdown-item" href="/rental">🤖 租用智能体</a>
          <a class="fwui-nav__dropdown-item" href="/polymarket">🔮 Polymarket</a>
        </div>
      </div>
    </div>
    <div class="fwui-nav__actions fwui-nav-actions-slot"></div>
    <button class="fwui-btn fwui-btn--sm" data-theme-toggle>明亮</button>
  </nav>

  
  <!-- 面包屑 -->
  <div class="fwui-breadcrumb">
    <a href="/" class="fwui-breadcrumb__home">🏠 首页</a>
    <span class="fwui-breadcrumb__sep">/</span>
    <span class="fwui-breadcrumb__current">租用智能体</span>
  </div>
  <main class="fwui-main">
    <h1 class="fwui-page-title">🤖 智能体租用</h1>
    <p class="fwui-page-subtitle">双轨计费：按次试算 / 包时段独占</p>

    <div class="fwui-tabs">
      <div class="fwui-tab fwui-tab--active" data-tab="per_use">⚡ 按次试算</div>
      <div class="fwui-tab" data-tab="package">📦 包时段</div>
      <div class="fwui-tab" data-tab="my">📋 我的租用</div>
    </div>

    <!-- 按次试算 -->
    <div id="tab-per-use">
      <div id="per-use-grid" class="fwui-card-grid fwui-card-grid--wide"></div>
    </div>

    <!-- 包时段 -->
    <div id="tab-package" style="display:none;">
      <div id="package-grid" class="fwui-card-grid fwui-card-grid--wide"></div>
    </div>

    <!-- 我的租用 -->
    <div id="tab-my" style="display:none;">
      <div id="my-rentals" class="fwui-card-grid fwui-card-grid--wide"></div>
    </div>
  </main>

  <script src="/static/js/fwui/theme.js"></script>
  <script src="/static/js/fwui/toast.js"></script>
  <script src="/static/js/fwui/modal.js"></script>
  <script src="/static/js/fwui/api.js"></script>
  <script src="/static/js/fwui/utils.js"></script>
  <script src="/static/js/fwui/charts.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/rental.js"></script>
</body>
</html>
