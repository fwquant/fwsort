<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账户 · 福纹排行榜</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="fwui-nav">
    <div class="fwui-nav__logo">🟣 福纹排行榜</div>
    <div class="fwui-nav__links">
      <a class="fwui-nav__link" href="/">📊 榜单</a>
      <a class="fwui-nav__link fwui-nav__link--active" href="/accounts">💼 我的账户</a>
      <a class="fwui-nav__link" href="/follow">👥 跟单</a>
      <a class="fwui-nav__link" href="/rental">🤖 租用智能体</a>
      <a class="fwui-nav__link" href="/admin">⚙️ 控制台</a>
      <a class="fwui-nav__link" href="/polymarket">🔮 Polymarket</a>
    </div>
    <div class="fwui-nav__actions fwui-nav-actions-slot"></div>
    <button class="fwui-btn fwui-btn--sm" data-theme-toggle>明亮</button>
  </nav>

  <main class="fwui-main">
    <h1 class="fwui-page-title">💼 我的执行账户</h1>
    <p class="fwui-page-subtitle">每个账户独立排榜。智能体只出信号，账户执行下单与风控。</p>

    <div class="fwui-toolbar">
      <button class="fwui-btn fwui-btn--primary" id="btn-create-account">+ 创建执行账户</button>
      <div class="fwui-toolbar__spacer"></div>

      <input type="text" class="fwui-input fwui-input--sm" id="account-search" placeholder="搜索账户名 / UID / 平台..." style="max-width:220px;">

      <select class="fwui-select fwui-select--sm" id="account-type-filter" style="max-width:90px;">
        <option value="-1">全部类型</option>
        <option value="0">模拟盘</option>
        <option value="1">实盘</option>
      </select>

      <div class="fwui-toolbar__group" style="margin-left:6px;">
        <span class="fwui-toolbar__label">视图</span>
        <select class="fwui-select fwui-select--sm" id="view-switch" style="max-width:70px;">
          <option value="list">列表</option>
          <option value="card">卡片</option>
        </select>
      </div>

      <span class="fwui-toolbar__count" id="account-count">--</span>
    </div>

    <div id="accounts-view" class="accounts-view"></div>

    <!-- 进入任务状态页 -->
    <div class="fwui-toolbar" style="margin-top:20px;justify-content:flex-end;">
      <a class="fwui-btn fwui-btn--sm" id="btn-go-tasks" href="/accounts/tasks">🛰 任务状态</a>
    </div>
  </main>

  <script src="/static/js/fwui/theme.js"></script>
  <script src="/static/js/fwui/toast.js"></script>
  <script src="/static/js/fwui/modal.js"></script>
  <script src="/static/js/fwui/api.js"></script>
  <script src="/static/js/fwui/utils.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/accounts.js"></script>
</body>
</html>
