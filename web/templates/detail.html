<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策略详情 · 福纹排行榜</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="fwui-nav">
    <a href="/" class="fwui-nav__logo-link">
      <div class="fwui-nav__logo">🟣 福纹排行榜</div>
    </a>
    <div class="fwui-nav__links">
      <!-- 榜单 -->
      <div class="fwui-nav__dropdown" data-nav-group="ranking">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link fwui-nav__link--active" href="/">📊 榜单</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/">🌍 总榜单</a>
          <a class="fwui-nav__dropdown-item" href="/accounts">👤 我的执行账户</a>
        </div>
      </div>
      <!-- 跟单 -->
      <a class="fwui-nav__link" href="/follow">👥 跟单</a>
      <!-- 策略 -->
      <div class="fwui-nav__dropdown" data-nav-group="strategy">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link" href="/strategy/tasks">📡 策略</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/strategy/tasks">📡 策略管理</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/auto-tasks">🤖 自动策略</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/logs">📜 策略日志</a>
        </div>
      </div>
      <!-- 齿轮 -->
      <div class="fwui-nav__dropdown" data-nav-group="console">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link" href="/admin" title="控制台">⚙️</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/admin">⚙️ 控制台</a>
          <a class="fwui-nav__dropdown-item" href="/risk">🛡️ 风控中心</a>
          <a class="fwui-nav__dropdown-item" href="/rental">🤖 租用智能体</a>
          <a class="fwui-nav__dropdown-item" href="/polymarket">🔮 Polymarket</a>
        </div>
      </div>
    </div>
    <div class="fwui-nav__actions fwui-nav-actions-slot"></div>
    <button class="fwui-btn fwui-btn--sm" data-theme-toggle>明亮</button>
  </nav>

  
  <!-- 面包屑 -->
  <div class="fwui-breadcrumb">
    <a href="/" class="fwui-breadcrumb__home">🏠 首页</a>
    <span class="fwui-breadcrumb__sep">/</span>
    <span class="fwui-breadcrumb__current">账户详情</span>
  </div>
  <main class="fwui-main">
    <h1 class="fwui-page-title" id="detail-title"><span class="fwui-skeleton">加载中...</span></h1>
    <div id="detail-meta" class="fwui-detail-meta"></div>

    <div id="detail-stats" class="fwui-stats-grid"></div>

    <!-- 图表区：净值 / 回撤 / 投票分布 / 执行质量 -->
    <div class="fwui-charts-grid">
      <div class="fwui-card">
        <div class="fwui-card__title">📈 净值曲线（30 天）</div>
        <div id="chart-equity" class="fwui-chart"></div>
      </div>
      <div class="fwui-card">
        <div class="fwui-card__title">📉 回撤曲线（30 天）</div>
        <div id="chart-drawdown" class="fwui-chart"></div>
      </div>
      <div class="fwui-card">
        <div class="fwui-card__title">🗳 投票方向分布（近 50 笔）</div>
        <div id="chart-vote-pie" class="fwui-chart"></div>
      </div>
      <div class="fwui-card">
        <div class="fwui-card__title">⚡ 执行质量分（近 14 天）</div>
        <div id="chart-exec" class="fwui-chart"></div>
      </div>
    </div>

    <!-- 触发投票 -->
    <div class="fwui-card fwui-section">
      <div class="fwui-card__title">🧠 触发 3 智能体预测 + 投票（V1.0）</div>
      <div class="fwui-form-row">
        <label class="fwui-form-field">
          <span class="fwui-form-label">交易对</span>
          <input class="fwui-input" id="symbol-input" value="BTCUSDT">
        </label>
        <label class="fwui-form-field fwui-form-field--narrow">
          <span class="fwui-form-label">时窗</span>
          <select class="fwui-select" id="tf-input">
            <option value="15m">15 分钟</option>
            <option value="1h">1 小时</option>
          </select>
        </label>
        <button class="fwui-btn fwui-btn--primary" id="btn-trigger-vote">🧠 触发预测+投票</button>
      </div>
      <div id="vote-result" class="fwui-vote-result"></div>
    </div>

    <!-- 执行日志 -->
    <div class="fwui-card fwui-section">
      <div class="fwui-card__title">📋 最近 20 条订单执行日志</div>
      <div class="fwui-table-wrap">
        <table class="fwui-table">
          <thead>
            <tr><th>订单ID</th><th>平台</th><th>方向</th><th>金额</th><th>状态</th><th>时间</th></tr>
          </thead>
          <tbody id="execution-logs">
            <tr><td colspan="6" class="fwui-empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>



  <script src="/static/js/fwui/theme.js"></script>
  <script src="/static/js/fwui/toast.js"></script>
  <script src="/static/js/fwui/modal.js"></script>
  <script src="/static/js/fwui/api.js"></script>
  <script src="/static/js/fwui/utils.js"></script>
  <script src="/static/js/fwui/charts.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/ranking_detail.js"></script>
</body>
</html>
