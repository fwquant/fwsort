<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执行策略 · 福纹排行榜</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="fwui-nav">
    <a href="/" class="fwui-nav__logo-link">
      <div class="fwui-nav__logo">🟣 福纹排行榜</div>
    </a>
    <div class="fwui-nav__links">
      <!-- 策略 -->
      <div class="fwui-nav__dropdown" data-nav-group="strategy">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link fwui-nav__link--active" href="/strategy/leaderboard">📡 策略</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/strategy/leaderboard">🏆 策略榜单</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/auto-tasks">🤖 自动策略</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/logs">📜 策略日志</a>
          <a class="fwui-nav__dropdown-item" href="/strategy/tasks">📡 策略管理</a>
        </div>
      </div>
      <!-- 账户 -->
      <div class="fwui-nav__dropdown" data-nav-group="accounts">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link" href="/accounts" title="我的执行账户">💼 账户</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/accounts">💼 执行账户</a>
          <a class="fwui-nav__dropdown-item" href="/accounts/tasks">🛰 账户任务</a>
          <a class="fwui-nav__dropdown-item" href="/accounts/execution">⚡ 执行记录</a>
        </div>
      </div>
      <!-- 齿轮 -->
      <div class="fwui-nav__dropdown" data-nav-group="console">
        <a class="fwui-nav__dropdown-trigger fwui-nav__link" href="/admin" title="控制台">⚙️</a>
        <div class="fwui-nav__dropdown-menu">
          <a class="fwui-nav__dropdown-item" href="/admin">⚙️ 控制台</a>
          <a class="fwui-nav__dropdown-item" href="/risk">🛡️ 风控中心</a>
          <a class="fwui-nav__dropdown-item" href="/rental">🤖 租用智能体</a>
          <a class="fwui-nav__dropdown-item" href="/polymarket">🔮 Polymarket</a>
        </div>
      </div>
    </div>
    <div class="fwui-nav__actions fwui-nav-actions-slot"></div>
    <button class="fwui-btn fwui-btn--sm" data-theme-toggle>明亮</button>
  </nav>

  
  <!-- 面包屑 -->
  <div class="fwui-breadcrumb">
    <a href="/" class="fwui-breadcrumb__home">🏠 首页</a>
    <span class="fwui-breadcrumb__sep">/</span>
    <span class="fwui-breadcrumb__current">执行账户详情</span>
  </div>
  <main class="fwui-main">
    <h1 class="fwui-page-title">⚡ 执行策略 <span style="font-size:13px;font-weight:500;color:#f59e0b;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);padding:2px 10px;border-radius:12px;vertical-align:middle;margin-left:8px;">🚧 待开发 · 演示数据</span></h1>
    <p class="fwui-page-subtitle">每个自动策略的执行流水线：方向刷新 → 预测投票 → 下单执行</p>

    <div style="background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(239,68,68,0.05));border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;">
      <div style="font-size:28px;">🚧</div>
      <div style="flex:1;">
        <div style="font-weight:600;color:#d97706;font-size:14px;margin-bottom:4px;">功能开发中</div>
        <div style="color:var(--fwui-text-muted);font-size:13px;line-height:1.5;">执行策略功能目前仅展示演示数据，真实的策略执行流水线对接正在开发中。</div>
      </div>
    </div>

    <div class="fwui-toolbar">
      <button class="fwui-btn fwui-btn--sm fwui-btn--primary" id="btn-refresh-exec">🔄 手动刷新</button>
      <div class="fwui-select-dropdown" data-view-dropdown="exec">
        <div class="fwui-select-dropdown__trigger">
          <span data-view-label>自动</span>
          <svg class="fwui-select-dropdown__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="fwui-select-dropdown__menu">
          <div class="fwui-select-dropdown__option is-selected" data-view="auto">
            <span class="fwui-select-dropdown__option-name">自动</span>
            <span class="fwui-select-dropdown__option-hint">PC默认列表，手机默认卡片</span>
          </div>
          <div class="fwui-select-dropdown__option" data-view="list">
            <span class="fwui-select-dropdown__option-name">列表</span>
            <span class="fwui-select-dropdown__option-hint">表格形式，适合PC查看</span>
          </div>
          <div class="fwui-select-dropdown__option" data-view="card">
            <span class="fwui-select-dropdown__option-name">卡片</span>
            <span class="fwui-select-dropdown__option-hint">卡片形式，适合手机查看</span>
          </div>
        </div>
      </div>
      <div class="fwui-toolbar__spacer"></div>
      <span class="fwui-toolbar__count" id="exec-count">--</span>
    </div>

    <div id="exec-table-wrap" style="display:none;">
      <div class="fwui-table-wrap">
        <table class="fwui-table">
          <thead>
            <tr>
              <th style="width:140px;">账户</th>
              <th style="width:80px;">状态</th>
              <th style="width:100px;">信号刷新</th>
              <th style="width:100px;">预测投票</th>
              <th style="width:100px;">下单执行</th>
              <th style="width:160px;">最近运行</th>
              <th style="width:120px;">操作</th>
            </tr>
          </thead>
          <tbody id="exec-table-body"></tbody>
        </table>
      </div>
    </div>
    <div id="exec-cards-wrap" class="tasks-view"></div>
  </main>

  <script src="/static/js/lib/fwui.js"></script>
  <script src="/static/js/accounts_execution.js"></script>
</body>
</html>
